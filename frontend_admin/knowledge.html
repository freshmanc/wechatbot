<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>知识管理 - 企业微信问答机器人</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, "Segoe UI", sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
    nav { margin-bottom: 24px; }
    nav a { margin-right: 16px; color: #1890ff; text-decoration: none; }
    nav a:hover { text-decoration: underline; }
    .card { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    h1 { margin: 0 0 8px 0; font-size: 20px; }
    .muted { color: #666; font-size: 14px; }
    input[type="file"], input[type="text"], select { padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; margin-right: 8px; margin-bottom: 8px; }
    button { padding: 8px 16px; background: #1890ff; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #40a9ff; }
    #doc_list { list-style: none; padding: 0; margin: 0; }
    #doc_list li { padding: 10px 0; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 12px; }
    #doc_list li .name { flex: 1; }
    #doc_list li .domain { color: #666; font-size: 13px; }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">首页 / 限额</a>
    <a href="knowledge.html">知识管理</a>
  </nav>
  <div class="card">
    <h1>知识上传</h1>
    <p class="muted">上传文档后将在后台进行切分与向量化入库（需后端实现）</p>
    <div style="margin-top: 16px;">
      <input type="file" id="file" accept=".txt,.md,.pdf" />
      <select id="domain">
        <option value="montreal_realestate">montreal_realestate</option>
      </select>
      <button id="upload_btn">上传</button>
      <span id="upload_msg" class="muted" style="margin-left: 12px;"></span>
    </div>
  </div>
  <div class="card">
    <h1>文档列表</h1>
    <p class="muted">已入库文档（占位，需接 GET /admin/knowledge/documents）</p>
    <ul id="doc_list">
      <li class="muted">暂无数据</li>
    </ul>
  </div>
  <script>
    const API_BASE = (window.location.port === '5500' || window.location.port === '3000')
      ? 'http://localhost:8000' : '';
    document.getElementById('upload_btn').onclick = async () => {
      const file = document.getElementById('file').files[0];
      const msg = document.getElementById('upload_msg');
      if (!file) { msg.textContent = '请选择文件'; return; }
      const domain = document.getElementById('domain').value;
      const fd = new FormData();
      fd.append('file', file);
      try {
        const r = await fetch(API_BASE + '/admin/knowledge/upload?domain=' + encodeURIComponent(domain), {
          method: 'POST',
          body: fd,
        });
        const d = await r.json().catch(() => ({}));
        msg.textContent = r.ok ? '已提交: ' + (d.filename || file.name) : '上传失败';
      } catch (e) {
        msg.textContent = '请求失败: ' + e.message;
      }
    };
  </script>
</body>
</html>
